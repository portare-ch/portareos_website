<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PortareOS</title>
  <meta name="description" content="PortareOS on GitHub.">
  <style>
    :root {
      color-scheme: dark;
      background: #030703;
      color: #45ff69;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      line-height: 1.35;
      text-shadow: 0 0 5px #45ff6959;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      padding: 0 8px 8px;
      border-bottom: 2px solid currentColor;
      font-size: 1em;
    }

    nav {
      min-height: 260px;
      padding: 24px 8px;
    }

    h2 {
      margin: 0 0 4px;
      font-size: 1em;
    }

    a {
      display: flex;
      align-items: baseline;
      gap: 0.5ch;
      width: fit-content;
      max-width: 100%;
      min-height: 44px;
      padding: 6px 0;
      color: #d6ffe3;
      text-decoration: none;
      text-shadow: 0 0 6px #6aff98a6;
    }

    .cursor { flex: none; }

    a:hover { color: #fff; }
    a:active { color: #45ff69; }
    a:focus-visible {
      outline: 2px solid #45ff69;
      outline-offset: 4px;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      border-top: 2px solid currentColor;
      padding: 8px;
      font-size: 0.8em;
    }

    kbd { font: inherit; }

    @media (max-width: 480px) {
      body { padding: 20px 16px; }
      nav { min-height: 220px; }
    }

    @media (forced-colors: active) {
      a { color: LinkText; }
      a:focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<body>
  <main>
    <h1>PortareOS</h1>
    <nav aria-labelledby="quick-access">
      <h2 id="quick-access">Quick access</h2>
      <a href="https://github.com/portare-ch/portareos">
        <span class="cursor" aria-hidden="true">&#9656;</span>
        <span>PortareOS on GitHub</span>
      </a>
    </nav>
    <footer>
      <span><kbd>Tab</kbd> Select</span>
      <span><kbd>Enter</kbd> Open</span>
    </footer>
  </main>
</body>
</html>
